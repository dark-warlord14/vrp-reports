name: Deploy VRP Reports

on:
  workflow_dispatch:
  push:
    branches: [main]          # redeploy on code/UI changes
    paths:
      - 'ui/**'
      - 'build.sh'
      - '.github/workflows/scrape.yml'
      - '.github/workflows/deploy.yml'
      - '_headers'

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code (main)
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Checkout data branch into data/
        uses: actions/checkout@v5
        with:
          ref: data
          path: data
          fetch-depth: 1

      - name: Build static dist/
        run: bash build.sh

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=vrp-reports --commit-dirty=true

      - name: Purge Cloudflare cache
        continue-on-error: true
        env:
          CF_ZONE: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_CACHE_PURGE_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          # Drops stale data files (index.json/stats.json/report.*) from the
          # custom-domain edge cache so a fresh deploy is visible immediately.
          # Skips quietly if no zone id is configured; never fails the deploy.
          if [ -z "${CF_ZONE}" ]; then
            echo "CLOUDFLARE_ZONE_ID not set — skipping cache purge."; exit 0
          fi
          curl -fsSL -X POST \
            "https://api.cloudflare.com/client/v4/zones/${CF_ZONE}/purge_cache" \
            -H "Authorization: Bearer ${CF_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}' && echo "Cloudflare cache purged."
